{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow">
            <div class="text-center mb-4">
                <h2 class="text-info fw-bold"><i class="bi bi-shield-shaded me-2"></i>勇者登入</h2>
                <p class="text-muted">準備好開始今天的挑戰了嗎？</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">冒險者名稱</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" id="username" placeholder="請輸入您的帳號" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" id="password" placeholder="請輸入密碼" required>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-gradient-primary btn-lg">進入世界</button>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-link text-info text-decoration-none mt-2">
                        <i class="bi bi-house-door me-1"></i>還沒註冊？前往新手村
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
