{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">創建勇者帳號</h3>
                
                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">帳號名稱</label>
                        <input type="text" class="form-control" id="username" name="username" required placeholder="請輸入您想使用的勇者名稱">
                        <div class="form-text">此名稱將作為登入帳號，且不可與他人重複。</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="請設定一組安全密碼">
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">註冊並開始冒險</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <span class="text-muted">已經有帳號了？</span>
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">返回登入</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
