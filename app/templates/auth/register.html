{% extends "base.html" %}

{% block content %}
<h2>註冊</h2>
<!-- 註冊表單骨架 -->
<form action="/register" method="POST">
    <!-- input 欄位 -->
</form>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow border-info">
            <h2 class="text-center mb-4 text-info">註冊新勇者</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">選擇使用者名稱</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">設定密碼</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-info btn-lg text-white">建立角色並出發</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <small>已經有帳號了？ <a href="{{ url_for('auth.login') }}" class="text-warning">返回登入</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
