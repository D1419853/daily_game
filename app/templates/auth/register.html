{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow">
            <div class="text-center mb-4">
                <h2 class="text-success fw-bold"><i class="bi bi-person-plus-fill me-2"></i>創建勇者帳號</h2>
                <p class="text-muted">加入冒險行列，把日常變成遊戲！</p>
            </div>
            
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">選擇冒險者名稱</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" id="username" placeholder="請輸入您的帳號" required>
                    </div>
                    <div class="form-text text-muted" style="font-size: 0.8rem;">此名稱不可與其他勇者重複。</div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">設定密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" id="password" placeholder="請設定安全密碼" required>
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-gradient-secondary btn-lg">建立角色並出發</button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link text-info text-decoration-none mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>已經有帳號了？返回登入
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
