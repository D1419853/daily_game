{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <h2 class="text-warning fw-bold">冒險者登入</h2>
                <p class="text-muted">準備好開始今天的挑戰了嗎？</p>
            </div>
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">冒險者名稱</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">進入世界</button>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-link text-info">還沒註冊？前往新手村</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
