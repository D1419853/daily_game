{% extends "base.html" %}

{% block content %}
<h2>新增任務</h2>
<!-- 新增任務表單骨架 -->
<form action="/tasks" method="POST">
    <!-- input 欄位 -->
</form>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow">
            <h3 class="mb-4">📜 建立新任務</h3>
            <form action="{{ url_for('tasks.create_task') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">任務標題</label>
                    <input type="text" name="title" class="form-control bg-dark text-white border-secondary" placeholder="例如：讀英文 30 分鐘" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">任務描述 (選填)</label>
                    <textarea name="description" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">設定難度 (影響傷害與獎勵)</label>
                    <select name="difficulty" class="form-select bg-dark text-white border-secondary">
                        <option value="1">⭐ 容易 (傷害 20 / 獎勵 10 XP)</option>
                        <option value="2">⭐⭐ 普通 (傷害 40 / 獎勵 20 XP)</option>
                        <option value="3">⭐⭐⭐ 困難 (傷害 60 / 獎勵 30 XP)</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-outline-light">取消</a>
                    <button type="submit" class="btn btn-success px-5">建立任務</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
