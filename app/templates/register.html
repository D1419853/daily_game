{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <h2 class="text-info fw-bold">新冒險者註冊</h2>
                <p class="text-muted">加入我們，將自律變成一場冒險。</p>
            </div>
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">選擇你的名稱</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-person-plus"></i></span>
                        <input type="text" name="username" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">設定秘密指令 (密碼)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-white border-secondary"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-transparent text-white border-secondary" required>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">建立角色</button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-link text-info">已經有角色？前往登入</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
