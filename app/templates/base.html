<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Fighter - 生活目標加打怪系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #1a1a2e; 
            color: #e9e9e9; 
            font-family: 'Microsoft JhengHei', sans-serif;
            min-height: 100vh;
        }
        .navbar { background-color: #16213e; border-bottom: 2px solid #0f3460; }
        .navbar-brand { font-weight: bold; color: #e94560 !important; font-size: 1.5rem; }
        .card { background-color: #16213e; border: 1px solid #0f3460; color: #e9e9e9; margin-bottom: 20px; }
        .btn-primary { background-color: #e94560; border: none; }
        .btn-primary:hover { background-color: #c62842; }
        .hp-bar { height: 25px; border-radius: 12px; background-color: #0f3460; overflow: hidden; position: relative; }
        .hp-inner { height: 100%; transition: width 0.5s ease-in-out; }
        .hp-text { position: absolute; width: 100%; text-align: center; font-size: 0.8rem; font-weight: bold; top: 2px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">⚔️ Quest Fighter</a>
            <div class="navbar-nav ms-auto">
                {% if session.get('user_id') %}
                    <a class="nav-link" href="{{ url_for('main.index') }}">遊戲大廳</a>
                    <a class="nav-link" href="{{ url_for('tasks.list_tasks') }}">任務管理</a>
                    <form action="{{ url_for('auth.logout') }}" method="POST" class="d-inline ms-2">
                        <button type="submit" class="btn btn-outline-light btn-sm">登出 ({{ session.get('username') }})</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{{ url_for('auth.login') }}">登入</a>
                    <a class="nav-link" href="{{ url_for('auth.register') }}">註冊帳號</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-warning alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
